<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>NotepadAI</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <textarea
        id="editor"
        spellcheck="false"
        aria-label="Notepad editor"
      ></textarea>
      <div id="status-bar" class="status-bar" aria-live="polite">
        <span id="status-position">Ln 1, Col 1</span>
        <span id="status-wrap">Word Wrap: On</span>
      </div>
    </div>

    <div
      id="ai-context-menu"
      class="ai-context-menu"
      role="menu"
      aria-hidden="true"
    >
      <form id="ai-custom-instruction-form" class="custom-instruction-form">
        <input
          id="ai-custom-instruction"
          type="text"
          placeholder="Custom instruction…"
          autocomplete="off"
        />
        <button id="ai-custom-instruction-submit" type="submit" class="primary">
          Go
        </button>
      </form>
      <div class="ai-context-menu-separator"></div>
      <button type="button" data-action="rewrite" role="menuitem">
        Rewrite
      </button>
      <button type="button" data-action="improve" role="menuitem">
        Improve
      </button>
      <button type="button" data-action="shorten" role="menuitem">
        Shorten
      </button>
      <button type="button" data-action="expand" role="menuitem">
        Expand
      </button>
      <button type="button" data-action="simplify" role="menuitem">
        Simplify
      </button>
      <button type="button" data-action="fix-grammar" role="menuitem">
        Fix Grammar
      </button>
      <div id="ai-context-menu-custom" class="ai-context-menu-custom"></div>
    </div>

    <div id="ai-modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <header>
          <h2>AI Settings</h2>
          <button id="ai-close" class="icon-button" aria-label="Close">×</button>
        </header>
        <div class="modal-body">
          <label>
            Provider
            <select id="ai-provider"></select>
          </label>
          <label>
            Base URL
            <input id="ai-base-url" type="text" placeholder="http://localhost:11434" />
            <span id="ai-base-url-hint" class="hint"></span>
          </label>
          <label>
            Model
            <div class="model-row">
              <input id="ai-model" type="text" list="ai-model-list" placeholder="enter a model id" />
              <button id="ai-fetch-models" class="ghost" type="button">Fetch Models</button>
            </div>
            <datalist id="ai-model-list"></datalist>
            <span id="ai-model-status" class="hint"></span>
          </label>
          <div id="ai-org-project" class="org-project-fields" hidden>
            <label>
              Organization (optional)
              <input id="ai-organization" type="text" placeholder="org-..." />
            </label>
            <label>
              Project (optional)
              <input id="ai-project" type="text" placeholder="proj_..." />
            </label>
          </div>
          <label>
            API Key
            <input id="ai-key" type="password" placeholder="Paste your key" />
            <span id="ai-key-status" class="hint">No key stored.</span>
          </label>
          <div id="ai-trust-warning" class="trust-warning" hidden>
            <span id="ai-trust-warning-text"></span>
            <button id="ai-trust-accept" class="ghost" type="button">Trust This Host &amp; Save</button>
          </div>
          <div class="test-connection-row">
            <button id="ai-test-connection" class="ghost" type="button">Test Connection</button>
            <span id="ai-test-status" class="hint"></span>
          </div>
          <label>
            Custom Prompt
            <textarea id="ai-prompt" rows="5" placeholder="Make this clearer and more concise."></textarea>
          </label>
          <div class="use-case-manager">
            <span class="section-label">Custom Use Cases</span>
            <span class="hint">Appears in the right-click menu alongside Rewrite/Improve/etc.</span>
            <div id="ai-use-case-list" class="use-case-list"></div>
            <div class="use-case-add-row">
              <input id="ai-use-case-label" type="text" placeholder="Label (e.g. Slack Message)" />
              <input id="ai-use-case-prompt" type="text" placeholder="Prompt (e.g. Rewrite as a casual Slack message.)" />
              <button id="ai-use-case-add" class="ghost" type="button">Add</button>
            </div>
          </div>
        </div>
        <footer>
          <button id="ai-clear" class="ghost">Clear Key</button>
          <div class="spacer"></div>
          <button id="ai-cancel" class="ghost">Cancel</button>
          <button id="ai-save" class="primary">Save</button>
        </footer>
      </div>
    </div>

    <div id="busy-overlay" class="busy" aria-hidden="true">
      <div id="busy-overlay-text" class="busy-card">Working…</div>
    </div>

    <div id="ai-stream-status" class="ai-stream-status" aria-hidden="true">
      <span id="ai-stream-status-text">Generating…</span>
      <button id="ai-stream-stop" class="ghost" type="button">Stop</button>
    </div>

    <div id="ai-result-bar" class="ai-result-bar" aria-hidden="true">
      <span class="ai-result-title">AI result ready</span>
      <div class="ai-result-actions">
        <button id="ai-apply" class="primary" type="button">Apply</button>
        <button id="ai-keep-both" type="button">Keep Both</button>
        <button id="ai-copy" type="button">Copy</button>
        <button id="ai-cancel-result" class="ghost" type="button">Cancel</button>
      </div>
    </div>
  </body>
</html>
